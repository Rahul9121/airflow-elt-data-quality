name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check dags checks scripts tests
      - name: Seed data
        run: python scripts/seed_data.py
      - name: Unit + DAG integrity tests
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dags
        run: |
          mkdir -p "$AIRFLOW_HOME"
          airflow db migrate
          pytest -q
      - name: airflow dags list / test good day
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dags
        run: |
          airflow dags list
          # Full task graph via headless runner (mirrors DAG tasks) for good day
          python scripts/run_pipeline.py --date 2024-06-01
          # Exercise DAG parse + test entrypoint
          airflow dags test trade_elt_quality_gates 2024-06-01 || true
      - name: Bad day must be blocked
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dags
        run: |
          set +e
          python scripts/run_pipeline.py --date 2024-06-03
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for blocked bad batch, got $code"
            exit 1
          fi
          test -f data/quarantine/2024-06-03.json
          test -f data/alerts/2024-06-03.json
      - name: Backfill remaining days
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dags
        run: |
          for d in 2024-06-02 2024-06-04 2024-06-05; do
            python scripts/run_pipeline.py --date "$d"
          done
      - name: Generate report
        run: python scripts/generate_report.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t airflow-elt-data-quality:ci .

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements-ci.txt
          python scripts/seed_data.py
          python scripts/run_pipeline.py --date 2024-06-01
          python scripts/run_pipeline.py --date 2024-06-02 || true
          set +e
          python scripts/run_pipeline.py --date 2024-06-03
          set -e
          python scripts/run_pipeline.py --date 2024-06-04
          python scripts/run_pipeline.py --date 2024-06-05
          python scripts/generate_report.py
          mkdir -p _site
          cp reports/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
